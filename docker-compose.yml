# Локальная разработка. Прод-деплой — тот же принцип Docker Compose на
# VPS (docs/01-tech-stack.md §10), но с реальными секретами и без
# проброса портов наружу — не копировать этот файл в прод как есть.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bullet_heaven
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
