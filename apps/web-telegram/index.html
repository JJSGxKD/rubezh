    <title>Рубеж</title>
    <!--
      Критичный CSS и заставка — прямо в разметке: между открытием мини-аппа и
      первым кадром оболочки не должно быть белого экрана
      (docs/27-design-system-and-app-shell.md §3.4).

      Заставка повторяет BootScreen оболочки — словесный знак, слоган, полоса — и тем же
      цветом: оболочка подменяет её своей, и подмена не должна быть видна.
      Цвета здесь числами, а не токенами: CSS оболочки ещё не загружен. При
      смене палитры в tokens.css правятся и они.
    -->
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1d1c31;
        color: #f3eee6;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      }
      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 100%;
        background:
          radial-gradient(120% 55% at 50% -12%, rgba(255, 143, 63, 0.16), transparent 62%),
          radial-gradient(100% 45% at 50% 112%, rgba(92, 207, 255, 0.1), transparent 60%),
          #1d1c31;
      }
      #splash svg {
        width: 288px;
        height: auto;
      }
      #splash p {
        max-width: 300px;
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        text-align: center;
        color: #aeaac4;
      }
      #splash i {
        position: relative;
        overflow: hidden;
        width: 192px;
        height: 6px;
        margin-top: 16px;
        border-radius: 9999px;
        background: #17162a;
      }
      #splash i::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 33%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff8f3f, #ffb67f);
        animation: splash-run 1.4s cubic-bezier(0.2, 0, 0.2, 1) infinite;
      }
      @keyframes splash-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @media (orientation: landscape) {
        #splash svg {
          width: 200px;
        }
        #splash p {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash i::after {
          animation: none;
        }
      }
    </style>
