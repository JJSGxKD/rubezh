# Внешняя проверка прода раз в 5 минут (docs/09-ci-cd.md): адреса — в переменной
# репозитория UPTIME_URLS, через пробел. Сообщение в чат команды — только при
# смене состояния; прежнее состояние — итог ближайшего прогона, давшего ответ
# (`scripts/ops/uptime-check.mjs`).
#
# Расписание (schedule) GitHub запускает только из ветки по умолчанию, то есть
# из `main`: проверка начнётся после ближайшего релиза. Ручной запуск — для
# проверки после настройки UPTIME_URLS.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Секрет бота — в окружении `telegram`; `deployment: false` — без записи
    # развёртывания на каждый прогон (288 в сутки тонули бы в истории).
    environment:
      name: telegram
      deployment: false
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Проверить прод
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          UPTIME_URLS: ${{ vars.UPTIME_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TEAM_TELEGRAM_BOT_TOKEN }}
          TEAM_TELEGRAM_CHAT: ${{ vars.TEAM_TELEGRAM_CHAT }}
        run: node scripts/ops/uptime-check.mjs
      - name: Прод недоступен
        if: steps.check.outputs.state == 'down'
        run: exit 1
