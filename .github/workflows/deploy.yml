# Выкат версии на прод (docs/09-ci-cd.md §10). Выкатывает уже выпущенный
# релиз — образ из GHCR и статику из GitHub Release, — пересборки нет.
#
# Запуск: вручную с номером версии (предрелизы из dev на закрытом тесте) или
# из ci.yml после релиза main. Конфигурация стека берётся из того же тега,
# что и код: выкатывается ровно то, что выпущено.
name: deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.6.0-rc.29"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

# Два выката одновременно переписали бы друг другу тег и ссылки статики.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Номер уходит в команду на сервере — только формат версии, иначе ручной
      # запуск со строкой вида «v1; …» выполнил бы её там.
      - name: Проверить номер версии
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "не номер версии: $VERSION"; exit 1; }'
        env:
          VERSION: ${{ inputs.version }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}

      # Контент игры из кода (docs/19-content-admin.md §4.5, tasks/T-0306): выгружается до того, как на
      # диске появится ключ доступа, — установка зависимостей исполняет чужие скрипты, и ключ им видеть
      # незачем. Релиз без выгрузки (старый тег, на который откатывают выкат) шаг пропускает: вернуть
      # прежнюю версию API не должно упираться в то, чего в ней ещё нет.
      - name: Есть ли выгрузка контента
        id: content
        run: |
          if [ -f scripts/content/run-export.mjs ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "в ${VERSION} нет выгрузки контента — версия из кода не заводится"; fi
        env:
          VERSION: ${{ inputs.version }}

      - if: steps.content.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.content.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.content.outputs.present == 'true'
        name: Выгрузка контента
        run: |
          pnpm install --frozen-lockfile
          node scripts/content/run-export.mjs --out dist/content

      # Ключ — из секрета во временный файл; отпечаток сервера закреплён
      # секретом, а не принимается при первом входе: иначе подмена адреса
      # получила бы и конфигурацию, и команду выката.
      - name: Доступ к серверу
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # Секреты сервера (.env, api.env) не трогаются: их нет в репозитории.
      - name: Конфигурация стека
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@${DEPLOY_HOST}" "mkdir -p /srv/rubezh/app/caddy /srv/rubezh/app/backup /srv/rubezh/app/postgres /srv/rubezh/app/xray"
          scp -i ~/.ssh/deploy -o BatchMode=yes \
            infra/prod/compose.yml infra/prod/Caddyfile infra/prod/frps.toml \
            infra/prod/deploy.sh infra/prod/backup.sh infra/prod/backup-watch.sh infra/prod/restore-drill.sh \
            infra/prod/edge-ips.sh \
            "deploy@${DEPLOY_HOST}:/srv/rubezh/app/"
          scp -i ~/.ssh/deploy -o BatchMode=yes infra/prod/caddy/Dockerfile "deploy@${DEPLOY_HOST}:/srv/rubezh/app/caddy/"
          scp -i ~/.ssh/deploy -o BatchMode=yes infra/prod/backup/Dockerfile infra/prod/backup/backupctl.sh "deploy@${DEPLOY_HOST}:/srv/rubezh/app/backup/"
          scp -i ~/.ssh/deploy -o BatchMode=yes infra/prod/postgres/pg_hba.conf "deploy@${DEPLOY_HOST}:/srv/rubezh/app/postgres/"
          scp -i ~/.ssh/deploy -o BatchMode=yes infra/prod/xray/Dockerfile infra/prod/xray/run.sh "deploy@${DEPLOY_HOST}:/srv/rubezh/app/xray/"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Выкат
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@${DEPLOY_HOST}" "cd /srv/rubezh/app && chmod 755 deploy.sh backup.sh backup-watch.sh restore-drill.sh edge-ips.sh && ./deploy.sh '${VERSION}'"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          VERSION: ${{ inputs.version }}

      # Версия «из кода» — после выката: миграции применены при старте нового API, он уже здоров. Файлы
      # выгрузки уходят в контейнер потоком тара, а не томом: ничего не остаётся ни на сервере, ни в
      # образе. Заводится версия, а указателем «в игре» она становится, только если там тоже версия из
      # кода, — выложенное из панели выкат не затирает (`content-adopt.ts`). Повтор выката безопасен: тот
      # же хэш ничего не меняет. Упал шаг — игра работает на прежнем контенте, шаг можно перезапустить.
      - if: steps.content.outputs.present == 'true'
        name: Версия контента из кода
        run: |
          tar -czf - -C dist/content . | ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@${DEPLOY_HOST}" 'cd /srv/rubezh/app && docker compose exec -T api sh -c "rm -rf /tmp/content-export && mkdir -p /tmp/content-export && tar -xzf - -C /tmp/content-export && node dist/cli/content-import.js /tmp/content-export"'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
