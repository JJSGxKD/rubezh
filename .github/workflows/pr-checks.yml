# Заголовок PR и метка релиза (docs/09-ci-cd.md §8.1, «Проверка PR»); SHA
# сторонних actions — сверка с тегом из комментария (§12).
#
# Логика — в scripts/release/pr-check.mjs и scripts/action-pins.mjs (покрыты
# тестами в scripts/test/), а не в стороннем action: короткая проверка
# регулярным выражением и сравнение меток не стоят внешней зависимости с
# правами на репозиторий.

name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история нужна, чтобы найти последний стабильный тег и
          # определить, действует ли ещё запрет release: major до 1.0.0.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: node scripts/release/pr-check.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Шагом этого же джоба, а не отдельным: `check` обязателен в ruleset
      # ветки main, и новый джоб оставался бы необязательным. Идёт и при
      # упавшей проверке заголовка — одна ошибка не должна прятать другую.
      - if: ${{ !cancelled() }}
        run: node scripts/action-pins.mjs --verify

      # Зоны задачи — тем же джобом, по той же причине: новый джоб не был бы
      # обязательным. Только для веток task/T-NNNN; у остальных PR шаг не
      # запускается. Дифф за зоны (zones, shared и файл задачи) без вопроса
      # тимлидам — повод вернуть PR, и ловить его лучше машиной, чем глазами
      # на приёмке.
      - if: ${{ !cancelled() && startsWith(github.head_ref, 'task/T-') }}
        run: |
          git fetch origin "${{ github.base_ref }}"
          node scripts/tasks/task.mjs diff-check --base "origin/${{ github.base_ref }}"
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
