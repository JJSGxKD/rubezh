# Гейт перед сборкой (docs/09-ci-cd.md §2).
#
# Реализованы шаги 2, 3, 5, 6, 7 и сборка. Пока НЕ реализованы и появляются
# отдельными задачами вместе с инструментами, которых в репозитории ещё нет:
#   1. prettier --check                    — форматирование
#   3. ESLint в type-checked режиме        — сейчас линт базовый
#   4. eslint-plugin-boundaries + dependency-cruiser — границы слоёв проверяет
#      тест по исходникам (scripts/test/layer-boundaries.test.ts), а не линт
#
# Список выше — не украшение: расхождение CI и docs замечают тогда, когда
# полагаются на проверку, которой нет.

name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Минимальные права по умолчанию (docs/09-ci-cd.md §12, §8.1 «Права»):
# contents: write выдаётся точечно только джобу релиза.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest

    # Интеграционные тесты — на настоящих Postgres и Redis, а не на моках
    # (docs/17-testing-strategy.md §4.2). Без адресов ниже они пропускаются,
    # поэтому локальный `pnpm test` работает и без контейнеров.
    #
    # Образы — те же версия и digest, что в docker-compose.yml: CI проверяет
    # ту базу, на которой идёт разработка (docs/09-ci-cd.md §12). Разойтись
    # им не даёт scripts/image-pins.mjs.
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rubezh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rubezh_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/rubezh_test?schema=public
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/rubezh_test?schema=public
      PLAYTEST_TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Только lock-файл: расхождение с ним должно ломать сборку, а не
      # молча ставить другие версии (docs/16-tech-stack-decisions.md §9).
      # Клиент Prisma генерирует postinstall бэкенда; миграции — на базу
      # сервиса выше, тем же `migrate deploy`, что и в проде.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend-api prisma:deploy

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Бюджет бандла — после сборки: он меряет то, что реально уезжает на
      # устройство (docs/27-design-system-and-app-shell.md §3.4).
      - run: pnpm budget

  # Образ бэкенда собирается на каждом PR без публикации: иначе о поломке
  # Dockerfile узнаём в момент релиза, когда чинить дороже всего. Сторонних
  # actions здесь нет намеренно — `docker` на раннере уже есть, а внешняя
  # зависимость с правами на репозиторий ради одной команды не нужна
  # (docs/09-ci-cd.md §12).
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file backend/api/Dockerfile --tag rubezh-api:pr .
      # Карточки бота рисуются системными шрифтами: без шрифта в образе — или
      # когда resvg его не находит — текст пропадает целиком, а тесты на машине
      # с Windows этого не видят. Поэтому карточка рисуется в самом образе.
      - run: >-
          docker run --rm --entrypoint node
          -v "$PWD/backend/api/scripts/card-smoke.mjs:/app/backend/api/card-smoke.mjs:ro"
          rubezh-api:pr card-smoke.mjs

  # Версия по типу изменений в PR (docs/09-ci-cd.md §8.1): из main — стабильная
  # vX.Y.Z, из dev — предрелиз vX.Y.Z-rc.N. Доведён до тега, образа в GHCR,
  # GitHub Release и артефактов клиента и панели; выкат — job `deploy` ниже.
  # Матрица сборок по платформам (§1) — там же: `pnpm build` ниже собирает всё
  # одним прогоном.
  release:
    needs: gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.published.outcome == 'success' }}
    # Без отмены выполняющегося прогона: если за время одного релиза в
    # очередь встали два мерджа, GitHub оставит только последний, а
    # next-version.mjs всё равно посчитает максимум меток с базы
    # (docs/09-ci-cd.md §8.1, «Вычисление номера»).
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Вычислить версию
        id: version
        run: node scripts/release/next-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ github.ref == 'refs/heads/dev' && 'prerelease' || 'stable' }}

      # Выпускается только вершина ветки (docs/09-ci-cd.md §8.1, «Выпускается
      # вершина ветки»): если, пока прогон ждал в очереди, в ветку влили
      # следующий PR, эти изменения выпустит прогон новой вершины — вместе с
      # меткой этого PR. Собирать то, что не будет выпущено, незачем.
      - if: steps.version.outputs.has_release == 'true'
        name: Проверить вершину ветки
        id: tip
        run: node scripts/release/release-tag.mjs check
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}

      # Пересборка с настоящей версией: гейт выше собирал без неё, а версия
      # обязана попасть в бандл, события и отчёты (docs/09-ci-cd.md §8.1,
      # «Версия не коммитится обратно в репозиторий»).
      - if: steps.tip.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      # Имя бота — переменная репозитория, а не секрет: оно и так видно в
      # ссылках шеринга (docs/20-env-and-ports.md §7).
      - if: steps.tip.outputs.current == 'true'
        run: pnpm build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}

      # Артефакт клиента: то, что раскатывается на статику, берётся из этого
      # же прогона — пересборка перед деплоем запрещена (docs/09-ci-cd.md §7).
      - if: steps.tip.outputs.current == 'true'
        run: |
          tar -czf "rubezh-web-telegram-${{ steps.version.outputs.version }}.tar.gz" -C apps/web-telegram/dist .
          tar -czf "rubezh-admin-${{ steps.version.outputs.version }}.tar.gz" -C apps/admin/dist .

      # Имя пакета в GHCR должно быть в нижнем регистре, а владелец
      # репозитория пишется как есть — отсюда приведение регистра.
      - if: steps.tip.outputs.current == 'true'
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rubezh-api" >> "$GITHUB_OUTPUT"

      # Образ собирается здесь, а публикуется после тега: до тега наружу не
      # уходит ничего с номером версии (docs/09-ci-cd.md §8.1, «Порядок
      # публикации»).
      - if: steps.tip.outputs.current == 'true'
        run: >-
          docker build --file backend/api/Dockerfile
          --tag "${IMAGE}:${VERSION}"
          --tag "${IMAGE}:sha-${GITHUB_SHA::12}" .
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}

      # Тег — первым из того, что видно снаружи: отказать может именно он
      # (GitHub сверяет новый ref с workflow вершин веток), и отказ не должен
      # оставить в реестре образ под номером, которого нет в git. Ветка ушла
      # за время сборки — тега нет, created=false, и дальше ничего не
      # публикуется: это не ошибка, а тот же обгон, что и выше.
      - if: steps.tip.outputs.current == 'true'
        name: Поставить тег
        id: tag
        run: node scripts/release/release-tag.mjs create
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}

      # Черновик не виден снаружи и не рассылает уведомлений: релиз появится,
      # когда опубликован и образ. Артефакт клиента живёт у релиза, а не среди
      # артефактов прогона: у последних срок хранения ограничен, а откат на
      # версию месячной давности должен работать (docs/09-ci-cd.md §8.1,
      # «Права»).
      - if: steps.tag.outputs.created == 'true'
        name: Черновик релиза
        run: >-
          gh release create "$VERSION" "rubezh-web-telegram-${VERSION}.tar.gz" "rubezh-admin-${VERSION}.tar.gz"
          --draft --verify-tag --generate-notes
          ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
          ${{ steps.version.outputs.previous_tag != '' && format('--notes-start-tag {0}', steps.version.outputs.previous_tag) || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

      # Токен передаётся через окружение, а не подставляется в текст команды:
      # так он не окажется в трассировке шага (docs/09-ci-cd.md §12). Образ
      # под sha — первым, под номером версии — последним: оборвись push
      # посередине, в реестре останется только образ, версию не объявляющий.
      - if: steps.tag.outputs.created == 'true'
        name: Опубликовать образ
        id: publish_image
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:sha-${GITHUB_SHA::12}"
          docker push "${IMAGE}:${VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}

      - if: steps.tag.outputs.created == 'true'
        name: Опубликовать релиз
        id: published
        run: gh release edit "$VERSION" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

      # Сбой после тега: пока образа под номером нет, тег и черновик
      # удаляются, и номер достаётся следующему прогону; образ уже в реестре —
      # тег остаётся при нём (docs/09-ci-cd.md §8.1, «Порядок публикации»).
      - if: (failure() || cancelled()) && steps.tag.outputs.created == 'true'
        name: Откатить тег
        run: node scripts/release/release-tag.mjs rollback
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_PUSHED: ${{ steps.publish_image.outcome == 'success' }}

  # Выкат выпущенного на прод (docs/09-ci-cd.md §10). Стабильный релиз из main
  # выкатывается всегда; предрелизы из dev — пока на закрытом тесте включена
  # переменная репозитория DEPLOY_DEV_RELEASES: тестеры получают свежую сборку
  # после каждого мерджа, а выключить это — одна переменная, а не правка
  # workflow.
  deploy:
    needs: release
    if: needs.release.outputs.published == 'true' && (github.ref == 'refs/heads/main' || vars.DEPLOY_DEV_RELEASES == 'true')
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

