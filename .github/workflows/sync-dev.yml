# Возврат main в dev после каждого push в main (docs/09-ci-cd.md §8.1, «Ветка dev»).
#
# Логика — в scripts/release/sync-dev.mjs (решение покрыто тестами в
# scripts/test/release-branches.test.ts). Сразу после релиза dev → main ветка dev
# просто перематывается; если она за это время ушла вперёд — открывается PR.

name: Sync dev

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Два push в main подряд не должны открыть два одинаковых PR.
concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: node scripts/release/sync-dev.mjs
        env:
          GH_TOKEN: ${{ github.token }}
