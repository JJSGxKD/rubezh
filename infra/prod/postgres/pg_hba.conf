# Кому Postgres прода открывает двери (docs/20-env-and-ports.md §5.4).
#
# То же, что ставит официальный образ, и одна строка сверху: роль backup
# снимает базовую копию по протоколу репликации (infra/prod/backup). Без неё
# pg_basebackup из соседнего контейнера получает отказ — строки «all»
# репликацию не покрывают.
#
# TYPE  DATABASE     USER    ADDRESS       METHOD
local   all          all                   trust
host    all          all     127.0.0.1/32  trust
host    all          all     ::1/128       trust
local   replication  all                   trust
host    replication  backup  samenet       scram-sha-256
host    all          all     all           scram-sha-256
